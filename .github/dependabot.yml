version: 2
updates:
  - package-ecosystem: npm
    # The second directory pins the Socket Firewall fallback in the setup action.
    directories: [/, /.github/actions/setup/sfw]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
